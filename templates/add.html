<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title>Post a Job | JobConnect</title>
    <style>
        :root {
            --ink: #17233c;
            --muted: #68758d;
            --brand: #5146e5;
            --brand-dark: #4035c7;
            --line: #e3e7f0;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(ellipse at 80% 10%, rgba(119, 106, 255, .14), transparent 35%),
                #f5f7fb;
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        a { color: inherit; text-decoration: none; }

        .site-header {
            background: rgba(255, 255, 255, .92);
            border-bottom: 1px solid var(--line);
        }

        .nav, .container {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
        }

        .nav {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -.04em;
        }

        .brand-mark {
            display: grid;
            width: 36px;
            height: 36px;
            place-items: center;
            border-radius: 11px;
            background: var(--brand);
            color: white;
            font-size: 1.05rem;
        }

        .back-link { color: var(--muted); font-size: .94rem; font-weight: 650; }
        .back-link:hover { color: var(--brand); }

        .container { padding: 52px 0 64px; }

        .form-card {
            width: min(100%, 680px);
            margin: 0 auto;
            padding: clamp(24px, 5vw, 42px);
            border: 1px solid var(--line);
            border-radius: 18px;
            background: white;
            box-shadow: 0 15px 45px rgba(30, 43, 76, .07);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--brand);
            font-size: .78rem;
            font-weight: 800;
            letter-spacing: .13em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 4vw, 2.45rem);
            letter-spacing: -.05em;
        }

        .intro {
            margin: 10px 0 28px;
            color: var(--muted);
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field { display: flex; flex-direction: column; gap: 8px; }
        .field-wide { grid-column: 1 / -1; }

        label { font-size: .9rem; font-weight: 700; }

        input, textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-size: .96rem;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        input { min-height: 48px; padding: 0 14px; }
        textarea { min-height: 144px; padding: 13px 14px; resize: vertical; }

        input:focus, textarea:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(81, 70, 229, .12);
        }

        .error {
            margin: 0 0 18px;
            padding: 12px 14px;
            border: 1px solid #f4c7c7;
            border-radius: 9px;
            background: #fff4f4;
            color: #9e2929;
            font-size: .92rem;
        }

        .form-actions {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 24px;
        }

        .button {
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            border: 0;
            border-radius: 10px;
            background: var(--brand);
            color: white;
            font: inherit;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }

        .button:hover { background: var(--brand-dark); transform: translateY(-1px); }

        @media (max-width: 560px) {
            .nav, .container { width: min(100% - 28px, 1120px); }
            .nav { min-height: 66px; }
            .container { padding-top: 30px; }
            .form-grid { grid-template-columns: 1fr; gap: 16px; }
            .field-wide { grid-column: auto; }
            .form-actions { align-items: stretch; flex-direction: column; gap: 14px; }
            .form-actions .button { width: 100%; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="Main navigation">
            <a class="brand" href="{{ url_for('home') }}">
                <span class="brand-mark" aria-hidden="true">J</span>
                <span>JobConnect</span>
            </a>
            <a class="back-link" href="{{ url_for('home') }}">Back to jobs</a>
        </nav>
    </header>

    <main class="container">
        <section class="form-card" aria-labelledby="form-heading">
            <p class="eyebrow">Help someone find their next role</p>
            <h1 id="form-heading">Post a new job</h1>
            <p class="intro">Share the details below to add your opportunity to JobConnect.</p>

            {% if error %}
                <p class="error" role="alert">{{ error }}</p>
            {% endif %}

            <form action="{{ url_for('add_job') }}" method="post">
                <div class="form-grid">
                    <div class="field">
                        <label for="title">Job title</label>
                        <input id="title" name="title" type="text" value="{{ form_data.get('title', '') }}" placeholder="e.g. Product Designer" required>
                    </div>
                    <div class="field">
                        <label for="company">Company</label>
                        <input id="company" name="company" type="text" value="{{ form_data.get('company', '') }}" placeholder="e.g. Acme Inc." required>
                    </div>
                    <div class="field">
                        <label for="location">Location</label>
                        <input id="location" name="location" type="text" value="{{ form_data.get('location', '') }}" placeholder="e.g. Hyderabad" required>
                    </div>
                    <div class="field">
                        <label for="salary">Salary</label>
                        <input id="salary" name="salary" type="text" value="{{ form_data.get('salary', '') }}" placeholder="e.g. ₹8–12 LPA" required>
                    </div>
                    <div class="field field-wide">
                        <label for="description">Job description</label>
                        <textarea id="description" name="description" placeholder="Describe the role and what makes it a great opportunity..." required>{{ form_data.get('description', '') }}</textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="button" type="submit">Publish job</button>
                    <a class="back-link" href="{{ url_for('home') }}">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
